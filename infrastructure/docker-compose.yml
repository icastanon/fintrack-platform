services:
  postgres:
    image: postgres:17
    container_name: fintrack-postgres

    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:2026.07.2
    container_name: fintrack-localstack

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required}

volumes:
  postgres-data: