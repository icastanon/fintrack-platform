name: Verify and deploy backend

on:
  pull_request:
    paths:
      - "event-contracts/**"
      - "services/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw*"
      - ".github/workflows/deploy-backend.yml"

  push:
    branches:
      - main
    paths:
      - "event-contracts/**"
      - "services/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw*"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""

  ECS_CLUSTER: fintrack-dev-cluster

  API_ECR_REPOSITORY: fintrack-dev/api-service
  API_ECS_SERVICE: fintrack-dev-api-service
  API_TASK_DEFINITION_FAMILY: fintrack-dev-api-service
  API_CONTAINER_NAME: api-service

  WORKER_ECR_REPOSITORY: fintrack-dev/worker-service
  WORKER_ECS_SERVICE: fintrack-dev-worker-service
  WORKER_TASK_DEFINITION_FAMILY: fintrack-dev-worker-service
  WORKER_CONTAINER_NAME: worker-service

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      deploy_api: ${{ steps.changes.outputs.deploy_api }}
      deploy_worker: ${{ steps.changes.outputs.deploy_worker }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine services to deploy
        id: changes
        shell: bash
        run: |
          DEPLOY_API=false
          DEPLOY_WORKER=false
          BEFORE_SHA="${{ github.event.before }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DEPLOY_API=false
            DEPLOY_WORKER=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            DEPLOY_API=true
            DEPLOY_WORKER=true
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            echo "$CHANGED_FILES"

            if grep -Eq '^(event-contracts/|pom\.xml$|\.mvn/|mvnw|\.github/workflows/deploy-backend\.yml$)' <<< "$CHANGED_FILES"; then
              DEPLOY_API=true
              DEPLOY_WORKER=true
            else
              if grep -q '^services/api-service/' <<< "$CHANGED_FILES"; then
                DEPLOY_API=true
              fi

              if grep -q '^services/worker-service/' <<< "$CHANGED_FILES"; then
                DEPLOY_WORKER=true
              fi
            fi
          fi

          echo "deploy_api=$DEPLOY_API" >> "$GITHUB_OUTPUT"
          echo "deploy_worker=$DEPLOY_WORKER" >> "$GITHUB_OUTPUT"
          echo "Deploy API: $DEPLOY_API"
          echo "Deploy worker: $DEPLOY_WORKER"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run complete Maven verification
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: ./mvnw -B verify

  deploy:
    name: Deploy to ECS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: fintrack-dev-backend-deployment
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate to AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintrack-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or reuse commit-specific images
        id: images
        shell: bash
        env:
          DEPLOY_API: ${{ needs.verify.outputs.deploy_api }}
          DEPLOY_WORKER: ${{ needs.verify.outputs.deploy_worker }}
        run: |
          if [[ "$DEPLOY_API" == "true" ]]; then
            API_IMAGE="${{ steps.login-ecr.outputs.registry }}/${API_ECR_REPOSITORY}:${GITHUB_SHA}"

            if aws ecr describe-images \
              --repository-name "$API_ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" \
              --region "$AWS_REGION" > /dev/null 2>&1; then
              echo "Reusing existing API image: $API_IMAGE"
            else
              docker build --file services/api-service/Dockerfile --tag "$API_IMAGE" .
              docker push "$API_IMAGE"
            fi

            echo "api_image=$API_IMAGE" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$DEPLOY_WORKER" == "true" ]]; then
            WORKER_IMAGE="${{ steps.login-ecr.outputs.registry }}/${WORKER_ECR_REPOSITORY}:${GITHUB_SHA}"

            if aws ecr describe-images \
              --repository-name "$WORKER_ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" \
              --region "$AWS_REGION" > /dev/null 2>&1; then
              echo "Reusing existing worker image: $WORKER_IMAGE"
            else
              docker build --file services/worker-service/Dockerfile --tag "$WORKER_IMAGE" .
              docker push "$WORKER_IMAGE"
            fi

            echo "worker_image=$WORKER_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Download current API task definition
        if: needs.verify.outputs.deploy_api == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$API_TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > api-task-definition.json

      - name: Insert API image into task definition
        if: needs.verify.outputs.deploy_api == 'true'
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-definition.json
          container-name: ${{ env.API_CONTAINER_NAME }}
          image: ${{ steps.images.outputs.api_image }}
          environment-variables: |
            FINTRACK_HTTP_TRUST_CLOUDFRONT_VIEWER_ADDRESS=true

      - name: Deploy API service
        if: needs.verify.outputs.deploy_api == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.API_ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke-test API readiness
        if: needs.verify.outputs.deploy_api == 'true'
        run: |
          curl --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "${{ vars.API_BASE_URL }}/actuator/health/readiness"

      - name: Download current worker task definition
        if: needs.verify.outputs.deploy_worker == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$WORKER_TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > worker-task-definition.json

      - name: Insert worker image into task definition
        if: needs.verify.outputs.deploy_worker == 'true'
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-definition.json
          container-name: ${{ env.WORKER_CONTAINER_NAME }}
          image: ${{ steps.images.outputs.worker_image }}

      - name: Deploy worker service
        if: needs.verify.outputs.deploy_worker == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ${{ env.WORKER_ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true