spring.application.name=worker-service

logging.pattern.correlation=%correlationId{correlationId(1)}

spring.main.web-application-type=none

fintrack.sqs.transaction-processing-queue=fintrack-transaction-processing

spring.datasource.url=jdbc:postgresql://localhost:5432/fintrack
spring.datasource.username=fintrack
spring.datasource.password=fintrack

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.client-name=fintrack-worker
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

fintrack.redis.categorization-rules-ttl=5m

fintrack.sqs.import-jobs-queue=fintrack-import-jobs

fintrack.s3.import-bucket=${FINTRACK_S3_IMPORT_BUCKET:fintrack-imports}

spring.batch.job.enabled=false

fintrack.sqs.import-jobs-visibility-extension-seconds=120
fintrack.sqs.import-jobs-visibility-heartbeat-seconds=30

fintrack.batch.import-processing-lease-duration=PT2M