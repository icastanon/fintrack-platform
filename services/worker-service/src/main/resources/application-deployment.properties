# Machine-readable deployment logs
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${FINTRACK_ENVIRONMENT:local-container}

# Keep production exceptions useful without producing unbounded log events
logging.structured.json.stacktrace.root=first
logging.structured.json.stacktrace.max-length=16384
logging.structured.json.stacktrace.max-throwable-depth=50