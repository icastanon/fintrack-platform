spring.application.name=api-service

logging.pattern.correlation=%correlationId{correlationId(1)}

spring.datasource.url=jdbc:postgresql://localhost:5432/fintrack
spring.datasource.username=fintrack
spring.datasource.password=fintrack

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=your-super-secret-key-that-is-at-least-32-characters-long
jwt.expiration=86400000

jwt.refresh-token-expiration=604800000

spring.cloud.aws.region.static=us-east-1

fintrack.sqs.transaction-processing-queue=fintrack-transaction-processing

fintrack.outbox.relay.enabled=false
fintrack.outbox.relay.batch-size=10
fintrack.outbox.relay.max-attempts=3
fintrack.outbox.relay.retry-delay=30s
fintrack.outbox.relay.claim-timeout=2m
fintrack.outbox.relay.fixed-delay-ms=1000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.client-name=fintrack-api
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

fintrack.rate-limit.login-limit=10
fintrack.rate-limit.login-window=1m
fintrack.rate-limit.registration-limit=5
fintrack.rate-limit.registration-window=1h

fintrack.rate-limit.authenticated-user-limit=120
fintrack.rate-limit.authenticated-user-window=1m

fintrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Request-size and parser limits
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-parameter-count=100
server.tomcat.max-part-count=10
server.tomcat.max-part-header-size=512B
server.tomcat.max-swallow-size=12MB

spring.jackson.factory.constraints.read.max-document-length=1048576
spring.jackson.factory.constraints.read.max-string-length=10000
spring.jackson.factory.constraints.read.max-name-length=100
spring.jackson.factory.constraints.read.max-nesting-depth=20
spring.jackson.factory.constraints.read.max-number-length=100
spring.jackson.factory.constraints.read.max-token-count=10000

spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:11MB}

fintrack.s3.import-bucket=${FINTRACK_S3_IMPORT_BUCKET:fintrack-imports}
fintrack.import.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}

fintrack.sqs.import-jobs-queue=fintrack-import-jobs

fintrack.rate-limit.import-submission-limit=5
fintrack.rate-limit.import-submission-window=1h

# Actuator health probes
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Database connection pool
spring.datasource.hikari.pool-name=fintrack-api-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
